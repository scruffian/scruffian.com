<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="google-site-verification" content="GZrBinKaN7OiaKePvaXOqTjze3__3pXxS3Rt4A528f8" />
	<title>scruffian.com: a scruffy ruffian</title>
	<style>
		html, body { margin: 0; overflow-x: hidden; }

		body { background: #10140d; }

		/* Fills the window when it can. Below 1400px the photo stops shrinking
		   and bleeds off the sides instead -- the outer 18.6% left / 24.4%
		   right is only grass. The crop is lopsided, 43% off the left and 57%
		   off the right, because there is more spare grass on the right.
		   1.7x is near the hard limit: past 1.754x no split exists that keeps
		   every object on screen, so this is as big as it can go. */
		.scene {
			--iw: clamp(100vw, 1400px, 170vw);
			margin: 0 0 0 calc((100vw - var(--iw)) * 0.43);
			position: relative;
			width: var(--iw);
		}

		/* height:auto is load-bearing -- without it the width/height attributes
		   below would squash the picture to a literal 1506px tall */
		.scene img { display: block; height: auto; width: 100%; }

		/* the eleven things you can click: no visual treatment at all */
		.spot {
			height: var(--h);
			left: var(--l);
			position: absolute;
			top: var(--t);
			width: var(--w);
		}

		/* keyboard focus only -- never shows for a mouse */
		.spot:focus-visible { outline: 3px solid #fff9e6; outline-offset: 2px; }

		/* each link's name, kept for screen readers but never drawn */
		.tag { clip-path: inset(50%); height: 1px; position: absolute; white-space: nowrap; width: 1px; }
	</style>
</head>
<body>
	<figure class="scene">
		<img src="desk-2000.jpg"
		     srcset="desk-2000.jpg 2000w, desk-3000.jpg 3000w"
		     sizes="(min-width: 1400px) 100vw, (min-width: 825px) 1400px, 170vw"
		     width="2000" height="1506" alt="Eleven objects laid out on grass: four notebooks labelled in tape with Music, daily haiku, 1005 Songs and blog; a camera; a beer mat printed with a hare crest; a framed painting of a straw-bale building; an orange trowel; notebooks labelled off rhyme and trailslog; and a leather Bible labelled sync.">

		<a class="spot" style="--l:23.5%;--t:5.8%;--w:11.5%;--h:22.7%" href="http://music.scruffian.com"><span class="tag">music.scruffian.com</span></a>
		<a class="spot" style="--l:37.8%;--t:5.4%;--w:11.8%;--h:23.0%" href="https://haiku.blog"><span class="tag">haiku.blog</span></a>
		<a class="spot" style="--l:51.0%;--t:5.6%;--w:11.4%;--h:22.5%" href="https://1005songs.wordpress.com/"><span class="tag">1005 songs</span></a>
		<a class="spot" style="--l:63.4%;--t:5.6%;--w:12.2%;--h:23.0%" href="https://ben.blog"><span class="tag">ben.blog</span></a>
		<a class="spot" style="--l:22.1%;--t:32.4%;--w:16.0%;--h:29.0%" href="https://photograffian.wordpress.com/"><span class="tag">Photograffian</span></a>
		<a class="spot" style="--l:41.6%;--t:39.3%;--w:10.8%;--h:14.6%" href="https://wearemountainhares.com/"><span class="tag">We Are Mountain Hares</span></a>
		<a class="spot" style="--l:52.9%;--t:32.0%;--w:22.7%;--h:23.2%" href="https://strawdio.com"><span class="tag">strawdio.com</span></a>
		<a class="spot" style="--l:18.6%;--t:49.3%;--w:8.9%;--h:37.2%" href="https://trails.foundation"><span class="tag">trails.foundation</span></a>
		<a class="spot" style="--l:30.6%;--t:65.9%;--w:10.7%;--h:19.9%" href="https://offrhyme.com"><span class="tag">offrhyme.com</span></a>
		<a class="spot" style="--l:44.5%;--t:66.4%;--w:10.5%;--h:19.9%" href="trailslog"><span class="tag">trailslog</span></a>
		<a class="spot" style="--l:59.4%;--t:61.6%;--w:13.5%;--h:25.5%" href="https://sync.bible"><span class="tag">sync.bible</span></a>
	</figure>
</body>
</html>
