<script>
function isLocalBlogUrl(url)
{
	return !/^(?:[a-z]+:|\/\/|#)/i.test(url);
}

function resolveBlogAssetPaths(root, baseUrl)
{
	var attrs = ['href', 'src'];
	for (var i = 0; i < attrs.length; i++)
	{
		var attr = attrs[i];
		var nodes = root.querySelectorAll('[' + attr + ']');
		for (var j = 0; j < nodes.length; j++)
		{
			var value = nodes[j].getAttribute(attr);
			if (value && isLocalBlogUrl(value))
			{
				nodes[j].setAttribute(attr, new URL(value, baseUrl).href);
			}
		}
	}
}

function loadBlog(url)
{
	if (!window.fetch) return true;
	var target = document.getElementById('blog-content');
	if (!target)
	{
		var text = document.getElementById('text');
		if (!text) return true;
		text.innerHTML = "<div id='blog-content'></div>";
		target = document.getElementById('blog-content');
	}
	var blogUrl = new URL(url, document.baseURI).href;
	target.innerHTML = '<p>Loading...</p>';
	fetch(blogUrl)
		.then(function(response) {
			if (!response.ok) throw new Error('Could not load blog page');
			return response.text().then(function(html) {
				return { html: html, url: response.url };
			});
		})
		.then(function(result) {
			var holder = document.createElement('div');
			holder.innerHTML = result.html;
			resolveBlogAssetPaths(holder, result.url);
			target.innerHTML = holder.innerHTML;
		})
		.catch(function() {
			target.innerHTML = '<p><a href="' + blogUrl + '">Open this blog page</a></p>';
		});
	return false;
}
