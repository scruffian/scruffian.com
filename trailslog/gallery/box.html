<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<meta name="Author" content="Ben Dwyer" />
<meta name="Description" content="Gallery" />
<meta name="Keywords" content="images" />
<meta name="robots" content="index,follow" />
<title>Scruffian Image Vault</title>
<script type="text/javascript" src="js/prototype.js"></script>
<script type="text/javascript" src="js/scriptaculous.js?load=effects"></script>
<script type="text/javascript" src="js/lightbox.js"></script>
<script type="text/javascript" src="gallery-data.js" charset="iso-8859-1"></script>
<link rel="stylesheet" href="css/lightbox.css" type="text/css" media="screen" />
<style>
	body { margin: auto; font-family: Verdana; font-size: 0.8em; color: #fff; background: #000; }
	ul { margin: 5px; padding: 0; list-style: none; }
	li { background: #333; margin: 0 10px 10px 0; padding: 5px 0; float: left; }
	li:hover { background: #999; }
	li:hover a { color: #000; }
	li a { padding: 5px; }
	a { color: #fff; text-decoration: none; }
	a:hover { color: #000; }
	p { margin: 5px 5px 10px 5px; padding: 0; }
	p a:hover { color: #999; }
</style>
<script type="text/javascript">
function galleryName(name) { return encodeURIComponent(name).replace(/%2F/g, '/'); }
function escapeHtml(value) { return String(value || '').replace(/[&<>\"]/g, function(character) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[character]; }); }
function currentSub() { var sub = new URLSearchParams(window.location.search).get('sub') || ''; return DATA[sub] ? sub : ''; }
function renderGallery() {
	var sub = currentSub();
	var galleries = Object.keys(DATA);
	var list = '';
	var count;
	for (count = 0; count < galleries.length; count++) {
		var gallery = galleries[count];
		list += '<li><a href="box.html?sub=' + galleryName(gallery) + '">' + escapeHtml(gallery) + '</a></li>';
	}
	document.getElementById('galleryList').innerHTML = list;
	var files = sub ? DATA[sub] : [];
	var imageHtml = '';
	for (count = 0; count < files.length; count++) {
		var image = files[count];
		var caption = escapeHtml(image.caption || '');
		var path = galleryName(sub) + '/' + galleryName(image.file);
		imageHtml += '<div style="width: 100px; height: 100px; overflow: hidden; float: left; margin: 5px;">';
		imageHtml += '<a href="' + path + '" rel="lightbox[' + escapeHtml(sub) + ']" title="' + caption + '">';
		imageHtml += '<img src="' + path + '" alt="' + caption + '" border="0" style="width: 200px; margin: -16px 0 0 -50px;" />';
		imageHtml += '</a></div>';
	}
	document.getElementById('images').innerHTML = imageHtml;
	var url = sub ? '?sub=' + galleryName(sub) : '';
	document.getElementById('slideLink').href = 'index.html' + url;
	document.getElementById('scrollLink').href = 'scroll.html' + url;
}
</script>
</head>
<body>
<p><a href="../index.html">scruffian.com</a> | <a href="box.html">image gallery</a></p>
<ul id="galleryList"></ul>
<div id="images" style="margin: auto; clear: both;"></div>
<br clear="all" />
<p align="center"><a id="slideLink" href="index.html">Slideshow View</a> | <a id="scrollLink" href="scroll.html">Scrolling View</a></p>
<script type="text/javascript">renderGallery();</script>
</body>
</html>
